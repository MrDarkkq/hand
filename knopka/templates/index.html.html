<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Состояние</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .state {
            font-size: 48px;
            font-weight: bold;
            padding: 40px;
            margin: 20px;
            border-radius: 10px;
        }
        .сжато { background: #ffcccc; color: #900; }
        .разжато { background: #ccffcc; color: #090; }
        button {
            font-size: 20px;
            padding: 10px 30px;
            cursor: pointer;
            margin: 10px;
        }
        .links {
            margin-top: 40px;
            font-size: 14px;
        }
        a {
            margin: 0 10px;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Текущее состояние</h1>
    <div class="state {{ state }}" id="state">{{ state }}</div>
    
    <button onclick="toggle()">Переключить</button>
    
    <div class="links">
        <a href="/state/compressed">📦 Сжато</a>
        <a href="/state/expanded">📂 Разжато</a>
        <br><br>
        <a href="/?state=compressed">?state=compressed</a>
        <a href="/?state=expanded">?state=expanded</a>
    </div>

    <script>
        const socket = io();
        
        socket.on('update', (data) => {
            document.getElementById('state').innerHTML = data.state;
            document.getElementById('state').className = 'state ' + data.state;
        });
        
        function toggle() {
            socket.emit('switch');
        }
    </script>
</body>
</html>
