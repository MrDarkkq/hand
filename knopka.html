<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простая кнопка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            font-size: 48px;
            padding: 20px 40px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        button.on {
            background: #4CAF50;
            color: white;
            box-shadow: 0 5px 0 #2d6a2f;
        }
        button.off {
            background: #f44336;
            color: white;
            box-shadow: 0 5px 0 #b71c1c;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0;
        }
        .status {
            margin-top: 30px;
            font-size: 24px;
            color: #333;
        }
        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            font-family: monospace;
        }
        a {
            color: #2196F3;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>⚡ Статус кнопки</h2>
    <button id="mainButton">🔘</button>
    <div class="status" id="statusText">Статус: ожидание</div>
    <div class="hint">
        📍 Добавьте в URL:<br>
        <a href="?press_on">?press_on</a> — ВКЛ<br>
        <a href="?press_off">?press_off</a> — ВЫКЛ
    </div>
</div>

<script>
    const button = document.getElementById('mainButton');
    const statusDiv = document.getElementById('statusText');
    
    let currentState = null;
    
    function getStateFromURL() {
        if (location.search.includes('press_on')) return 'on';
        if (location.search.includes('press_off')) return 'off';
        return null;
    }
    
    function updateUI(state) {
        if (state === 'on') {
            button.textContent = '✅ ВКЛ';
            button.className = 'on';
            statusDiv.innerHTML = 'Статус: <strong style="color:#4CAF50">ВКЛЮЧЕНА</strong>';
        } else if (state === 'off') {
            button.textContent = '⭕ ВЫКЛ';
            button.className = 'off';
            statusDiv.innerHTML = 'Статус: <strong style="color:#f44336">ВЫКЛЮЧЕНА</strong>';
        } else {
            button.textContent = '🔘';
            button.className = '';
            statusDiv.innerHTML = 'Статус: <strong>ожидание команды</strong>';
        }
    }
    
    function setState(state, updateURL = true) {
        currentState = state;
        updateUI(state);
        
        if (updateURL) {
            const url = new URL(window.location.href);
            url.searchParams.delete('press_on');
            url.searchParams.delete('press_off');
            if (state === 'on') url.searchParams.set('press_on', '');
            if (state === 'off') url.searchParams.set('press_off', '');
            window.history.pushState({}, '', url);
        }
    }
    
    function handleButtonClick() {
        if (currentState === 'on') setState('off');
        else if (currentState === 'off') setState('on');
        else setState('on');
    }
    
    function handlePopState() {
        const urlState = getStateFromURL();
        currentState = urlState;
        updateUI(urlState);
    }
    
    const initial = getStateFromURL();
    currentState = initial;
    updateUI(initial);
    
    button.addEventListener('click', handleButtonClick);
    window.addEventListener('popstate', handlePopState);
</script>
</body>
</html>
